name: Build and publish desktop release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release.yml"
  workflow_dispatch:

# v0.1.2 distributes the macOS build as an ad-hoc signed DMG.

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies and Electron
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
        run: npm install --legacy-peer-deps
      - run: npm run desktop:renderer
      - name: Build and ad-hoc sign macOS Apple Silicon app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
          ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/
        run: |
          npx electron-builder --mac --arm64 --dir --publish never
          codesign --force --deep --sign - "release/mac-arm64/在呢 ZAI NE.app"
          codesign --verify --deep --strict "release/mac-arm64/在呢 ZAI NE.app"
      - name: Create macOS DMG installer
        run: |
          mkdir -p release/dmg-root
          ditto "release/mac-arm64/在呢 ZAI NE.app" "release/dmg-root/在呢 ZAI NE.app"
          ln -s /Applications release/dmg-root/Applications
          hdiutil create -volname "在呢 ZAI NE" -srcfolder release/dmg-root -ov -format UDZO "release/zai-ne-0.1.2-macOS-Apple-Silicon.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: release/zai-ne-0.1.2-macOS-Apple-Silicon.dmg
          if-no-files-found: error

  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies and Electron
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
        run: npm install --legacy-peer-deps
      - run: npm run desktop:renderer
      - name: Package Windows x64
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
          ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/
        run: npx electron-builder --win nsis --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: release/zai-ne-0.1.2-Windows-x64.exe
          if-no-files-found: error

  publish:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: macos-release
          path: release-assets
      - uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: release-assets
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.1.2 \
            release-assets/zai-ne-0.1.2-macOS-Apple-Silicon.dmg \
            release-assets/zai-ne-0.1.2-Windows-x64.exe \
            --repo "${{ github.repository }}" \
            --title "在呢 ZAI NE 0.1.2" \
            --notes "macOS 版现已改为 DMG 安装镜像，并加入基础的本地签名。下载后请将应用拖入“应用程序”；首次打开请在访达中右键应用并选择“打开”。本测试版尚未使用 Apple Developer ID 公证，因此部分 macOS 版本仍可能显示安全提醒。Windows 版继续提供 EXE 安装程序。数据默认只保存在自己的电脑。"
