name: Build and publish desktop release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release.yml"
  workflow_dispatch:

# v0.1.1 adds independent, time-ordered scratch-note entries.

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies and Electron
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
        run: npm install --legacy-peer-deps
      - run: npm run desktop:renderer
      - name: Package macOS Apple Silicon
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
          ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/
        run: npx electron-builder --mac zip --arm64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: release/zai-ne-0.1.1-macOS-Apple-Silicon.zip
          if-no-files-found: error

  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies and Electron
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
        run: npm install --legacy-peer-deps
      - run: npm run desktop:renderer
      - name: Package Windows x64
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
          ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/
        run: npx electron-builder --win nsis --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: release/zai-ne-0.1.1-Windows-x64.exe
          if-no-files-found: error

  publish:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: macos-release
          path: release-assets
      - uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: release-assets
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.1.1 \
            release-assets/zai-ne-0.1.1-macOS-Apple-Silicon.zip \
            release-assets/zai-ne-0.1.1-Windows-x64.exe \
            --repo "${{ github.repository }}" \
            --title "在呢 ZAI NE 0.1.1" \
            --notes "本次更新修复随手记：每条想法独立保存，按发布时间倒序排列；快捷记录不会覆盖原文；编辑模式只编辑当前选中的一条。数据仍默认只保存在自己的电脑。安装包暂未进行商店签名，首次打开时系统可能显示安全提醒。"
