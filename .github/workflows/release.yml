name: Build and publish desktop release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release.yml"
  workflow_dispatch:

# v0.1.0 release rebuild with prebuilt macOS and Windows icons.

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies and Electron
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
        run: npm install --legacy-peer-deps
      - run: npm run desktop:renderer
      - name: Package macOS Apple Silicon
        id: package_macos
        continue-on-error: true
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
          ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/
        run: |
          set -o pipefail
          npx electron-builder --mac zip --arm64 --publish never 2>&1 | tee macos-package.log
      - name: Report macOS packaging failure
        if: steps.package_macos.outcome == 'failure'
        run: |
          details="$(tail -n 60 macos-package.log)"
          details="${details//'%'/'%25'}"
          details="${details//$'\r'/'%0D'}"
          details="${details//$'\n'/'%0A'}"
          echo "::error file=.github/workflows/release.yml,title=macOS packaging failed::$details"
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: release/zai-ne-0.1.0-macOS-Apple-Silicon.zip
          if-no-files-found: error

  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies and Electron
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
        run: npm install --legacy-peer-deps
      - run: npm run desktop:renderer
      - name: Package Windows x64
        id: package_windows
        continue-on-error: true
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
          ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/
        shell: pwsh
        run: |
          npx electron-builder --win nsis --x64 --publish never 2>&1 | Tee-Object windows-package.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Report Windows packaging failure
        if: steps.package_windows.outcome == 'failure'
        shell: pwsh
        run: |
          $details = [string]::Join([Environment]::NewLine, (Get-Content windows-package.log -Tail 60))
          $details = $details.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
          Write-Output "::error file=.github/workflows/release.yml,title=Windows packaging failed::$details"
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: release/zai-ne-0.1.0-Windows-x64.exe
          if-no-files-found: error

  publish:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: macos-release
          path: release-assets
      - uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: release-assets
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.1.0 \
            release-assets/zai-ne-0.1.0-macOS-Apple-Silicon.zip \
            release-assets/zai-ne-0.1.0-Windows-x64.exe \
            --repo "${{ github.repository }}" \
            --title "在呢 ZAI NE 0.1.0" \
            --notes "公开测试版：待办、真实日历、Markdown 随手记与本地知识库。无需注册，数据默认只保存在自己的电脑。安装包暂未进行商店签名，首次打开时系统可能显示安全提醒。"
